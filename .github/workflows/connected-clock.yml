# Generated by scripts/build_github_clock.py. All 144 slots exist before execution.
name: Bounded GitHub notification clock
run-name: Clock ${{ inputs.mode }} (${{ inputs.ticks }} slots)
on:
  workflow_dispatch:
    inputs:
      ticks:
        description: Three diagnostic ticks or a bounded 24-hour session
        type: choice
        options: ['3', '144']
        default: '3'
      mode:
        type: choice
        options: [probe, notify]
        default: probe
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: connected-notification-clock
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      start: ${{ steps.session.outputs.start }}
      end: ${{ steps.session.outputs.end }}
      ticks: ${{ steps.session.outputs.ticks }}
      first_environment: ${{ steps.session.outputs.first_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: session
        run: node session.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICKS: ${{ inputs.ticks }}
          CLOCK_MODE: ${{ inputs.mode }}
  tick_001:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && fromJSON(needs.prepare.outputs.ticks || '0') >= 1 }}
    uses: ./.github/workflows/clock-tick.yml
    with:
      start: ${{ needs.prepare.outputs.start }}
      end: ${{ needs.prepare.outputs.end }}
      planned: ${{ needs.prepare.outputs.start }}
      environment: ${{ needs.prepare.outputs.first_environment }}
      mode: ${{ inputs.mode }}
      index: '1'
    secrets:
      PRIVATE_DISPATCH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
      TARGET_REPOSITORY: ${{ secrets.TARGET_REPOSITORY }}
  tick_002:
    needs: [prepare, tick_001]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && fromJSON(needs.prepare.outputs.ticks || '0') >= 2 && needs.tick_001.result != 'skipped' && needs.tick_001.outputs.halt != 'true' }}
    uses: ./.github/workflows/clock-tick.yml
    with:
      start: ${{ needs.prepare.outputs.start }}
      end: ${{ needs.prepare.outputs.end }}
      planned: ${{ needs.tick_001.outputs.next_planned || needs.prepare.outputs.start }}
      environment: ${{ needs.tick_001.outputs.next_environment || 'clock-wait-9' }}
      mode: ${{ inputs.mode }}
      index: '2'
    secrets:
      PRIVATE_DISPATCH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
      TARGET_REPOSITORY: ${{ secrets.TARGET_REPOSITORY }}
  tick_003:
